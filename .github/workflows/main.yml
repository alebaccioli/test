name: Crea playlist

on:
  push:
    paths:
      - 'iptv/fonti/**'
  workflow_dispatch: # Trigger manuale

jobs:
  crea-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Esegui checkout
        uses: actions/checkout@v7
      - name: Inizializza Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Esegui crea-playlist.py
        run: python iptv/script/crea-playlist.py
      - name: Commit e push dei file generati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iptv/playlist
          git diff --cached --quiet || git commit -m "[bot] Aggiornate playlist"
          git push
