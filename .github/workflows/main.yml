name: Crea playlist

on:
  push:
    paths:
      - 'iptv/**.csv'

  # Allows you to manually trigger the workflow from the Actions tab for testing
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13' 

      - name: Run Script
        run: python iptv/crea-playlist.py
